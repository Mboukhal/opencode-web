services:
  opencode-web:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.3.2}
    image: opencode-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    # The app serves through the Coolify proxy on the shared network.
    environment:
      ADDR: ":8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to the public https origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-lios80466@gmail.com}
      DATA_DIR: /data
      PROJECTS_DIR: /data/projects
      OPENCODE_CONFIG_DIR: /data/config
      OPENCODE_STATE_DIR: /data/state
      DB_PATH: /data/app/app.db
      SSH_KEY_PATH: /data/ssh/id_ed25519
      OPENCODE_BIN: ${OPENCODE_BIN:-/data/install/opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode/muse-spark-1.3}
      OPENCODE_TIMEOUT: ${OPENCODE_TIMEOUT:-30m}
      GITHUB_ORGS: ${GITHUB_ORGS:-login:Mboukhal}
      # Shared OpenCode server (the one OpenCode Mobile pairs with).
      OPENCODE_SERVICE_HOST: ${OPENCODE_SERVICE_HOST:-0.0.0.0}
      # Pin the port so Traefik can publish it on the pairing hostname.
      OPENCODE_SERVICE_PORT: ${OPENCODE_SERVICE_PORT:-4096}
      # Origin phones use to redeem the pairing code. This must route to the
      # OpenCode server, not to this web app.
      MOBILE_PAIR_URL: ${MOBILE_PAIR_URL:-https://opencode.mboukhal.dev}
      # Local skills copied into the OpenCode config dir on boot.
      SKILLS_SRC: ${SKILLS_SRC:-/data/skills}
      # Provider keys ("provider=key;provider=key") stored as credentials.
      PROVIDER_KEYS: ${PROVIDER_KEYS:-}
      # Extra variables for the server and every agent child process.
      OPENCODE_ENV: ${OPENCODE_ENV:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Mohammed Boukhal}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-lios80466@gmail.com}
      # Security headers: redirect to HTTPS and HSTS. Coolify terminates TLS,
      # so ForceHTTPS only affects requests that reach the app as plain HTTP.
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      EXTRA_CSP_ORIGINS: ${EXTRA_CSP_ORIGINS:-}
    volumes:
      - /data/opencode/projects:/data/projects
      - /data/opencode/config:/data/config
      - /data/opencode/state:/data/state
      - /data/opencode/install:/data/install
      - /data/opencode/ssh:/data/ssh:ro
      - /data/opencode/skills:/data/skills
      - /data/opencode/app:/data/app
      - /data/opencode/home:/data/home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - coolify.managed=true
      - coolify.applicationId=${COOLIFY_APP_ID:-}
      - coolify.type=application
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-${COOLIFY_APP_UUID:-opencode}.entryPoints=http
      - traefik.http.routers.http-0-${COOLIFY_APP_UUID:-opencode}.middlewares=redirect-to-https
      - traefik.http.routers.http-0-${COOLIFY_APP_UUID:-opencode}.rule=Host(`${COOLIFY_FQDN:-code.mboukhal.dev}`)
      - traefik.http.routers.http-0-${COOLIFY_APP_UUID:-opencode}.service=http-0-${COOLIFY_APP_UUID:-opencode}
      - traefik.http.routers.https-0-${COOLIFY_APP_UUID:-opencode}.entryPoints=https
      - traefik.http.routers.https-0-${COOLIFY_APP_UUID:-opencode}.middlewares=gzip
      - traefik.http.routers.https-0-${COOLIFY_APP_UUID:-opencode}.rule=Host(`${COOLIFY_FQDN:-code.mboukhal.dev}`)
      - traefik.http.routers.https-0-${COOLIFY_APP_UUID:-opencode}.service=https-0-${COOLIFY_APP_UUID:-opencode}
      - traefik.http.routers.https-0-${COOLIFY_APP_UUID:-opencode}.tls=true
      - traefik.http.routers.https-0-${COOLIFY_APP_UUID:-opencode}.tls.certresolver=letsencrypt
      - traefik.http.services.https-0-${COOLIFY_APP_UUID:-opencode}.loadbalancer.server.port=8080
      # OpenCode server on its own hostname, used only for mobile pairing.
      - traefik.http.routers.opencode-api-http.entryPoints=http
      - traefik.http.routers.opencode-api-http.middlewares=redirect-to-https
      - traefik.http.routers.opencode-api-http.rule=Host(`${COOLIFY_PAIR_FQDN:-opencode.mboukhal.dev}`)
      - traefik.http.routers.opencode-api-http.service=opencode-api
      - traefik.http.routers.opencode-api-https.entryPoints=https
      - traefik.http.routers.opencode-api-https.middlewares=gzip
      - traefik.http.routers.opencode-api-https.rule=Host(`${COOLIFY_PAIR_FQDN:-opencode.mboukhal.dev}`)
      - traefik.http.routers.opencode-api-https.service=opencode-api
      - traefik.http.routers.opencode-api-https.tls=true
      - traefik.http.routers.opencode-api-https.tls.certresolver=letsencrypt
      - traefik.http.services.opencode-api.loadbalancer.server.port=${OPENCODE_SERVICE_PORT:-4096}
    networks:
      - coolify

networks:
  coolify:
    external: true
